# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        v: ["8.0.x"]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the SDK UniOne 2.3.0 in NuGet
        timeout-minutes: 95
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://api.nuget.org/v3-flatcontainer/unione/index.json" && grep -qF '"2.3.0"' /tmp/sdk; then
              echo "UniOne 2.3.0 is in NuGet"; exit 0
            fi
            echo "UniOne 2.3.0 is not in NuGet yet ($i/180)"; sleep 30
          done
          echo "::error::UniOne 2.3.0 did not appear in NuGet in 90 min: publish the SDK first"; exit 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.v }}
      - run: |
          dotnet test
